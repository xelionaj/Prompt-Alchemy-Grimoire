[project]
name = "prompt-alchemy-grimoire"
description = "Prompt composition and wildcard selector node for ComfyUI."
version = "0.9.23"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Graphics",
]

[tool.comfy]
DisplayName = "Prompt-Alchemy-Grimoire"
# The bundled library and the frontend extension are the product — force-include
# them so a packaged install includes content and the UI script.
includes = ["wildcards", "web"]
